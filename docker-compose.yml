  aistor:
    image: quay.io/minio/aistor/minio:latest
    container_name: propertypro-aistor
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: propertypro
      MINIO_ROOT_PASSWORD: "propertypro-dev-password"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aistor_data:/mnt/data
      - ./minio.license/minio.license:/minio.license:ro
    command: server /mnt/data --console-address ":9001" --license /minio.license

volumes:
  # sqlserver_data:
  aistor_data:

