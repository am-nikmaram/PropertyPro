<section class="editor"><a class="back" routerLink="/app/assets"><i class="pi pi-arrow-left"></i> Back to assets</a><header><span class="eyebrow">PROPERTY PORTFOLIO</span><h1>{{id?'Edit asset':'Add an asset'}}</h1><p>Asset identity, location, and maintenance details.</p></header>
 @if(loading()){<div class="panel">Loading asset…</div>}@else{<form class="panel" (ngSubmit)="save()"><h2>Asset information</h2><div class="fields">
  @if(!id){<label>Asset number <span>*</span><input pInputText name="assetNumber" [(ngModel)]="form.assetNumber" required maxlength="50" /></label>}<label>Asset name <span>*</span><input pInputText name="name" [(ngModel)]="form.name" required maxlength="200" /></label>
  <label>Category <span>*</span><select name="assetCategoryId" [(ngModel)]="form.assetCategoryId" required><option [ngValue]="0" disabled>Select category</option>@for(c of categories();track c.id){<option [ngValue]="c.id">{{c.name}} · {{c.code}}</option>}</select></label>
  <label>Building <span>*</span><select name="buildingId" [ngModel]="buildingId()" (ngModelChange)="changeBuilding($event)" required><option [ngValue]="null" disabled>Select building</option>@for(b of buildings();track b.id){<option [ngValue]="b.id">{{b.name}} · {{b.code}}</option>}</select></label>
  <label>Room <span>*</span><select name="roomId" [(ngModel)]="form.roomId" required [disabled]="!buildingId()"><option [ngValue]="0" disabled>Select room</option>@for(r of visibleRooms();track r.id){<option [ngValue]="r.id">{{r.roomNumber}} · {{r.name}}</option>}</select></label>
  <label>Criticality <select name="criticality" [(ngModel)]="form.criticality"><option [ngValue]="1">Low</option><option [ngValue]="2">Medium</option><option [ngValue]="3">High</option><option [ngValue]="4">Critical</option></select></label>
  <label>Status <select name="status" [(ngModel)]="form.status"><option [ngValue]="1">Active</option><option [ngValue]="2">In maintenance</option><option [ngValue]="3">Under repair</option><option [ngValue]="4">Retired</option><option [ngValue]="5">Disposed</option><option [ngValue]="6">Lost</option></select></label>
  <label>Manufacturer<input pInputText name="manufacturer" [(ngModel)]="form.manufacturer" maxlength="100" /></label><label>Model<input pInputText name="model" [(ngModel)]="form.model" maxlength="100" /></label><label>Serial number<input pInputText name="serialNumber" [(ngModel)]="form.serialNumber" maxlength="100" /></label>
  <label>Installation date<input pInputText type="date" name="installationDate" [(ngModel)]="form.installationDate" /></label><label>Warranty starts<input pInputText type="date" name="warrantyStartDate" [(ngModel)]="form.warrantyStartDate" /></label><label>Warranty ends<input pInputText type="date" name="warrantyEndDate" [(ngModel)]="form.warrantyEndDate" /></label><label>Purchase cost<input pInputText type="number" name="purchaseCost" [(ngModel)]="form.purchaseCost" min="0" step="0.01" /></label>
  <label class="wide">Description<textarea name="description" [(ngModel)]="form.description" rows="4" maxlength="1000"></textarea></label>
 </div>@if(error();as message){<div class="error" role="alert">{{message}}</div>}<div class="actions"><p-button label="Cancel" [text]="true" routerLink="/app/assets"/><p-button type="submit" [label]="id?'Save changes':'Create asset'" icon="pi pi-check" [loading]="saving()" [disabled]="saving()"/></div></form>}
</section>
